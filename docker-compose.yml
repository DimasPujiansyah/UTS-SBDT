# Docker Compose - Sistem Penjualan Minimarket Terdistribusi
# Setup dasar (single database) untuk pengembangan lokal.
# Untuk skenario Distributed Database (Master-Replica), gunakan tambahan
# file db/master-replica/docker-compose.master-replica.yml (lihat README.md).

services:
  app:
    build: ./php
    image: minimarket_terdistribusi_php:latest
    container_name: minimarket_terdistribusi_app
    hostname: "minimarket-terdistribusi"
    volumes:
      - ./src:/var/www/html
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    working_dir: /var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: minimarket_terdistribusi_db
    restart: unless-stopped
    tty: true
    ports:
      - "13306:3306"
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d:ro
    environment:
      MYSQL_DATABASE: minimarket_terdistribusi
      MYSQL_USER: minimarket
      MYSQL_PASSWORD: p455w0rd1!.
      MYSQL_ROOT_PASSWORD: p455w0rd
      TZ: Asia/Jakarta

  nginx:
    build: ./nginx
    image: minimarket_terdistribusi_nginx:latest
    container_name: minimarket_terdistribusi_nginx
    hostname: "minimarket-terdistribusi-nginx"
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
