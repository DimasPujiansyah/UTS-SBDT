# docker-compose.master-replica.yml
#
# File tambahan (bukan pengganti) untuk template/docker-compose.yml.
# Menyediakan 2 instance database: db-master (write) dan db-replica (read),
# sesuai kebutuhan Tugas Akhir "Sistem Penjualan Minimarket Terdistribusi".
#
# Cara pakai:
#   docker compose -f docker-compose.yml -f db/master-replica/docker-compose.master-replica.yml up -d
#
# Setelah kedua container hidup, jalankan langkah "Aktivasi Replikasi"
# yang dijelaskan di README-MASTER-REPLICA.md pada folder ini.

services:
  db-master:
    image: mariadb:10.11
    container_name: minimarket_db_master
    restart: unless-stopped
    ports:
      - "13306:3306"
    volumes:
      - ./db/master-replica/data-master:/var/lib/mysql
      - ./db/master-replica/my-master.cnf:/etc/mysql/conf.d/my-master.cnf:ro
      - ./db/master-replica/init-master.sql:/docker-entrypoint-initdb.d/init-master.sql:ro
    environment:
      MYSQL_DATABASE: minimarket_terdistribusi
      MYSQL_USER: minimarket
      MYSQL_PASSWORD: p455w0rd1!.
      MYSQL_ROOT_PASSWORD: p455w0rd
      TZ: Asia/Jakarta

  db-replica:
    image: mariadb:10.11
    container_name: minimarket_db_replica
    restart: unless-stopped
    ports:
      - "13307:3306"
    volumes:
      - ./db/master-replica/data-replica:/var/lib/mysql
      - ./db/master-replica/my-replica.cnf:/etc/mysql/conf.d/my-replica.cnf:ro
    environment:
      MYSQL_DATABASE: minimarket_terdistribusi
      MYSQL_ROOT_PASSWORD: p455w0rd
      TZ: Asia/Jakarta
    depends_on:
      - db-master
